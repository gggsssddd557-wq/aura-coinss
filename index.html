<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Coins</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101020;color:white;font-family:Arial,sans-serif;text-align:center;padding:25px 18px}
h1{color:#d8b4ff;font-size:32px}
.card{background:#20203a;border-radius:20px;padding:22px;margin:18px auto;max-width:420px}
.coins{font-size:38px;font-weight:bold;color:#ffd66b;margin:18px}
button{border:0;border-radius:18px;padding:17px 35px;background:#a56bff;color:white;font-size:20px;font-weight:bold}
button:disabled{opacity:.5}
#coin{font-size:100px;cursor:pointer;margin:20px}
li{padding:9px;text-align:left}
#status{color:#bcb6d1;font-size:13px}
</style>
</head>
<body>
<h1>✨ AURA COINS</h1>
<div class="card">
  <div>ТВОЙ БАЛАНС</div>
  <div class="coins" id="coins">0</div>
  <div id="coin">🪙</div>
  <button id="tap">ЗАРАБОТАТЬ +1</button>
  <p id="status">Подключение...</p>
</div>
<div class="card">
  <h2>🏆 Рейтинг игроков</h2>
  <ol id="top">Загрузка...</ol>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const API = "https://aura-coinss.onrender.com";
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let auth = tg.initData;
let balance = 0;
let busy = false;

async function request(path, method="GET") {
  const r = await fetch(API + path, {
    method,
    headers: {"Authorization": auth}
  });
  if (!r.ok) throw new Error("Ошибка " + r.status);
  return r.json();
}

async function load() {
  if (!auth) {
    document.getElementById("status").textContent =
      "Открой игру через Telegram, используя кнопку бота.";
    return;
  }
  try {
    const data = await request("/api/me");
    balance = data.coins;
    document.getElementById("coins").textContent = balance;
    document.getElementById("status").textContent = "Подключено!";
    await leaderboard();
  } catch(e) {
    document.getElementById("status").textContent =
      "Не удалось подключиться: " + e.message;
  }
}

async function leaderboard() {
  try {
    const rows = await request("/api/top");
    document.getElementById("top").innerHTML = rows.map(x =>
      "<li>" + escapeHtml(x.name) + " — " + x.coins + "</li>"
    ).join("");
  } catch(e) {
    document.getElementById("top").textContent = "Рейтинг недоступен";
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
  );
}

async function tap() {
  if (busy || !auth) return;
  busy = true;
  document.getElementById("tap").disabled = true;
  try {
    const data = await request("/api/tap", "POST");
    balance = data.coins;
    document.getElementById("coins").textContent = balance;
    await leaderboard();
  } catch(e) {
    document.getElementById("status").textContent =
      "Ошибка: " + e.message;
  }
  busy = false;
  document.getElementById("tap").disabled = false;
}

document.getElementById("tap").addEventListener("click", tap);
document.getElementById("coin").addEventListener("click", tap);
load();
</script>
</body>
</html>
