<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Aura Coins</title>

<style>
* { box-sizing:border-box; }
body {
    margin:0; background:linear-gradient(180deg,#100925,#211044);
    color:white;font-family:Arial,sans-serif;text-align:center;
    min-height:100vh;padding:20px 16px;
}
h1 {color:#ffd76a;margin:10px 0;}
.card {
    background:#29174a;border:1px solid #51367a;
    border-radius:18px;padding:16px;margin:14px auto;
    max-width:440px;
}
#balance {font-size:40px;font-weight:bold;color:#ffdc73;}
#coin {
    width:170px;height:170px;border-radius:50%;
    border:5px solid #ffdf75;
    background:radial-gradient(circle,#ffe98a,#d99821);
    color:#6d3900;font-size:55px;font-weight:bold;
    margin:20px auto;cursor:pointer;user-select:none;
    box-shadow:0 0 30px #e5a62e55;
    touch-action:manipulation;
}
#coin:active {transform:scale(.94);}
button {
    border:0;border-radius:12px;padding:14px;
    font-size:16px;font-weight:bold;color:white;
    background:#7045bd;cursor:pointer;width:100%;
    margin-top:8px;touch-action:manipulation;
}
button:disabled {opacity:.45;cursor:not-allowed;}
.shop button {background:#52318d;}
.small {color:#b9a6d8;font-size:14px;}
#energyBar {
    background:#46305f;border-radius:20px;height:14px;overflow:hidden;
}
#energyFill {
    height:100%;width:100%;background:#65e4b1;
    transition:width .15s;
}
#status {font-size:13px;color:#c9b7e5;min-height:20px;}
ul {padding:0;list-style:none;}
li {padding:8px;border-bottom:1px solid #483260;}
</style>
</head>

<body>

<h1>✨ Aura Coins ✨</h1>

<div class="card">
    <div id="balance">0</div>
    <div class="small">Aura Coins</div>

    <button id="coin">A</button>

    <div>Энергия: <span id="energy">0 / 0</span></div>
    <div id="energyBar"><div id="energyFill"></div></div>
    <p id="status"></p>
</div>

<div class="card shop">
    <h2>🛒 Улучшения</h2>

    <div>
        <b>Сила клика</b>
        <p class="small">Больше монет за нажатие</p>
        <button id="clickUpgrade"></button>
    </div>

    <div style="margin-top:15px">
        <b>Максимальная энергия</b>
        <p class="small">Увеличивает запас энергии</p>
        <button id="energyUpgrade"></button>
    </div>
</div>

<div class="card">
    <h2>🎁 Ежедневная награда</h2>
    <button id="daily">Получить +100 монет</button>
</div>

<div class="card">
    <h2>🏆 Лидеры</h2>
    <ul id="leaders">Загрузка...</ul>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const headers = {
    "Content-Type": "application/json",
    "Authorization": tg.initData
};

let data = null;
let queue = 0;
let processing = false;
let actionBusy = false;
let syncError = false;

const balanceEl = document.getElementById("balance");
const energyEl = document.getElementById("energy");
const energyFill = document.getElementById("energyFill");
const statusEl = document.getElementById("status");
const coin = document.getElementById("coin");
const clickBtn = document.getElementById("clickUpgrade");
const energyBtn = document.getElementById("energyUpgrade");

function getClickPrice(d) {
    return 50 * ((d.click_level || 0) + 1);
}
function getEnergyPrice(d) {
    return 100 * ((d.energy_level || 0) + 1);
}

function render() {
    if (!data) return;

    balanceEl.textContent = Math.floor(data.balance || 0);
    energyEl.textContent = `${data.energy || 0} / ${data.max_energy || 0}`;

    const percent = data.max_energy > 0
        ? (data.energy / data.max_energy) * 100 : 0;

    energyFill.style.width = percent + "%";

    clickBtn.textContent =
        `Улучшить клик — ${getClickPrice(data)} 🪙`;

    energyBtn.textContent =
        `Увеличить энергию — ${getEnergyPrice(data)} 🪙`;

    clickBtn.disabled =
        actionBusy || processing || queue > 0 ||
        data.balance < getClickPrice(data);

    energyBtn.disabled =
        actionBusy || processing || queue > 0 ||
        data.balance < getEnergyPrice(data);

    coin.disabled = data.energy <= 0 || syncError;
}

function showStatus(message) {
    statusEl.textContent = message;
}

async function request(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            ...headers,
            ...(options.headers || {})
        }
    });

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    return response.json();
}

async function load() {
    try {
        const result = await request("/api/me");
        data = result;
        syncError = false;
        render();
        showStatus("");
        return true;
    } catch (e) {
        showStatus("Не удалось соединиться. Попробуй обновить игру.");
        return false;
    }
}

coin.onclick = function() {
    if (!data || data.energy <= 0 || syncError) return;

    // Мгновенное отображение клика
    data.balance += data.click_power;
    data.energy -= 1;
    queue++;

    render();

    if (!processing) processTapQueue();
};

async function processTapQueue() {
    if (processing) return;
    processing = true;

    while (queue > 0) {
        queue--;

        try {
            const result = await request("/api/tap", {
                method: "POST"
            });

            data = result;
            syncError = false;
        } catch (e) {
            queue = 0;
            syncError = true;
            showStatus("Ошибка соединения. Синхронизируем баланс...");
            break;
        }
    }

    processing = false;

    // Получаем подтверждённое сервером состояние
    const ok = await load();

    if (!ok) {
        syncError = true;
        coin.disabled = true;
    }

    render();
}

async function upgrade(kind) {
    if (!data || actionBusy || processing || queue > 0) return;

    const price = kind === "click"
        ? getClickPrice(data)
        : getEnergyPrice(data);

    if (data.balance < price) return;

    actionBusy = true;
    render();

    try {
        const result = await request("/api/upgrade/" + kind, {
            method: "POST"
        });

        data = result;
        showStatus("Улучшение куплено!");
    } catch (e) {
        showStatus("Не удалось купить. Обновляем данные...");
        await load();
    }

    actionBusy = false;
    render();
}

clickBtn.onclick = () => upgrade("click");
energyBtn.onclick = () => upgrade("energy");

document.getElementById("daily").onclick = async function() {
    if (actionBusy || processing || queue > 0) return;

    actionBusy = true;
    render();

    try {
        const result = await request("/api/daily", {
            method: "POST"
        });

        data = result;
        showStatus("Ежедневная награда получена!");
    } catch (e) {
        showStatus("Награда уже получена или произошла ошибка.");
        await load();
    }

    actionBusy = false;
    render();
};

async function loadTop() {
    try {
        const result = await request("/api/top");
        const list = document.getElementById("leaders");

        list.innerHTML = "";

        const players = Array.isArray(result)
            ? result
            : (result.top || result.players || []);

        players.forEach((player, i) => {
            const li = document.createElement("li");

            li.textContent =
                `${i + 1}. ${player.username || player.name || "Игрок"} — ${player.balance ?? player.coins ?? 0}`;

            list.appendChild(li);
        });
    } catch(e) {
        document.getElementById("leaders").textContent =
            "Таблица временно недоступна";
    }
}

async function start() {
    await load();
    await loadTop();
}

start();
</script>
</body>
</html>
